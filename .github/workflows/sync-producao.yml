
name: Sincronizar homologacao com producao

on:
  pull_request:
    types: [closed]
    branches:
      - develope

permissions:
  contents: read

concurrency:
  group: sincronizacao-producao
  cancel-in-progress: false

jobs:
  criar-pr-producao:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homologacao
        uses: actions/checkout@v4
        with:
          ref: develope
          fetch-depth: 0
          path: homologacao
          persist-credentials: false

      - name: Checkout producao
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRODUCTION_REPOSITORY }}
          token: ${{ secrets.PRODUCTION_REPO_TOKEN }}
          ref: develope
          fetch-depth: 0
          path: producao

      - name: Preparar sincronizacao
        env:
          PRODUCTION_REPO: ${{ vars.PRODUCTION_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$PRODUCTION_REPO" ]]; then
            echo "::error::Configure a variavel PRODUCTION_REPOSITORY."
            exit 1
          fi

          SYNC_BRANCH="sync/homologacao-para-producao"

          git -C producao config user.name "github-actions[bot]"
          git -C producao config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Recria a branch automatica a partir da develope atual de producao.
          git -C producao checkout -B "$SYNC_BRANCH" origin/develope

          # Copia o conteudo de homologacao por cima de producao,
          # sem depender de historico em comum entre os repositorios.
          # Arquivos que nao devem ser sincronizados ficam no exclude.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='*.pem' \
            --exclude='certs/' \
            homologacao/ producao/

          git -C producao add -A

          # Evita criar PR quando nao ha diferenca de conteudo.
          if git -C producao diff --cached --quiet; then
            echo "Nao ha alteracoes para enviar a producao."
            exit 0
          fi

          git -C producao commit -m \
            "Sincronizacao: homologacao para producao"

          # Atualiza somente a branch reservada a automacao.
          git -C producao push --force origin "$SYNC_BRANCH"

      - name: Criar ou localizar PR de producao
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
          PRODUCTION_REPO: ${{ vars.PRODUCTION_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail

          SYNC_BRANCH="sync/homologacao-para-producao"

          PR_URL=$(gh pr list \
            --repo "$PRODUCTION_REPO" \
            --base develope \
            --head "$SYNC_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [[ -n "$PR_URL" ]]; then
            echo "PR de producao atualizado: $PR_URL"
          else
            gh pr create \
              --repo "$PRODUCTION_REPO" \
              --base develope \
              --head "$SYNC_BRANCH" \
              --title "Sincronizacao: homologacao para producao" \
              --body "PR criado automaticamente apos merge em homologacao.

          Revise as alteracoes antes de integrar em producao.
          Confira os testes, configuracoes e variaveis de ambiente."
          fi
